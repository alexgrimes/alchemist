<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alchemist v3.1 — Archived Version</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%E2%9A%97%3C/text%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=EB+Garamond:ital,wght@0,400;1,400&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08090b;--bg2:#0e1114;--bg3:#141820;--bg4:#1a2028;--bg5:#202832;
  --b1:#232d38;--b2:#2e3d4e;--b3:#3a4f62;
  --am:#b87a08;--am2:#d49020;--am3:#f0ac38;
  --tl:#0a7868;--tl2:#0e9880;--tl3:#20c0a0;
  --co:#903050;--co2:#b84068;--co3:#e06080;
  --pu:#504090;--pu2:#6858b8;--pu3:#9080e0;
  --tx:#c8c0b4;--tx2:#7a8898;--tx3:#3a4858;
  --gn:#1a7040;--gn2:#20904e;--gn3:#38b870;
  --mono:'Space Mono',monospace;
  --serif:'EB Garamond',serif;
}
html,body{background:var(--bg);color:var(--tx);font-family:var(--mono);font-size:11px;line-height:1.5;overflow:hidden;width:100vw;height:100vh}
.archive-banner{padding:10px 14px;background:rgba(184,122,8,.14);border-bottom:1px solid var(--am2);color:var(--tx);font-size:11px;text-align:center}
.archive-banner a{color:var(--tl3)}
#app{display:grid;grid-template-columns:230px 1fr 230px;grid-template-rows:40px 70px 1fr 150px;height:calc(100vh - 42px)}
#hdr{grid-column:1/-1;background:var(--bg2);border-bottom:1px solid var(--b1);display:flex;align-items:center;padding:0 12px;gap:10px}
#hdr .title{font-family:var(--serif);font-size:17px;color:var(--am3);font-style:italic}
#hdr .ver{font-size:9px;color:var(--tx3);letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
#hdr .hbtns{margin-left:auto;display:flex;gap:5px;align-items:center}

#scene-strip{grid-column:1/-1;background:var(--bg2);border-bottom:1px solid var(--b1);display:flex;align-items:center;padding:6px 12px;gap:8px;overflow-x:auto}
.scene-block{flex-shrink:0;display:flex;flex-direction:column;background:var(--bg3);border:1px solid var(--b2);border-radius:3px;padding:5px 8px;cursor:pointer;min-width:90px;position:relative}
.scene-block.active{border-color:var(--am3);background:rgba(184,122,8,.12)}
.scene-block:hover{border-color:var(--am2)}
.scene-name{font-size:10px;color:var(--am3);margin-bottom:2px;display:flex;align-items:center;gap:4px}
.scene-name input{background:transparent;border:none;color:var(--am3);font-family:var(--mono);font-size:10px;width:30px;padding:0}
.scene-meta{font-size:8px;color:var(--tx3);display:flex;align-items:center;gap:4px}
.scene-meta input{background:var(--bg4);border:1px solid var(--b2);color:var(--tx);font-family:var(--mono);font-size:8px;width:30px;padding:1px 2px;border-radius:2px}
.scene-rm{position:absolute;top:1px;right:3px;font-size:9px;color:var(--tx3);cursor:pointer;background:none;border:none}
.scene-rm:hover{color:var(--co3)}
.scene-trans{color:var(--tl3);font-size:14px;margin:0 -2px;cursor:pointer;user-select:none}
.scene-trans:hover{color:var(--am3)}

#left{background:var(--bg2);border-right:1px solid var(--b1);overflow-y:auto;padding:10px 8px}
#center{position:relative;overflow:hidden;background:var(--bg)}
#right{background:var(--bg2);border-left:1px solid var(--b1);overflow-y:auto;padding:10px 8px}
#bot{grid-column:1/-1;background:var(--bg2);border-top:1px solid var(--b1);display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:0}
.bp{padding:8px 12px;border-right:1px solid var(--b1)}
.bp:last-child{border-right:none}
.bp-title{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--am2);margin-bottom:6px}

.sec{margin-bottom:12px}
.sec-hd{font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--am2);border-bottom:1px solid var(--b1);padding-bottom:3px;margin-bottom:7px;display:flex;align-items:center;justify-content:space-between}
.sec-hd button{font-size:8px;background:none;border:1px solid var(--b2);color:var(--tx3);padding:1px 5px;border-radius:2px;cursor:pointer;font-family:var(--mono)}
.sec-hd button:hover{border-color:var(--am);color:var(--am3)}

.process-card{background:var(--bg3);border:1px solid var(--b1);border-radius:3px;padding:5px 7px;margin-bottom:5px}
.process-card .pc-hd{display:flex;align-items:center;gap:5px}
.process-card .pc-name{font-size:9px;color:var(--am3);flex:1}
.process-card .pc-rm{background:none;border:none;color:var(--tx3);cursor:pointer;font-size:10px;padding:0 2px}
.process-card .pc-rm:hover{color:var(--co3)}
.process-card .pc-op{font-size:8px;color:var(--tl3);background:var(--bg4);border:1px solid var(--b2);padding:1px 4px;border-radius:2px;cursor:pointer;font-family:var(--mono)}

.param-bus{background:var(--bg3);border:1px solid var(--b1);border-radius:3px;padding:6px 7px;margin-bottom:5px}
.pb-top{display:flex;align-items:center;gap:5px;margin-bottom:4px}
.pb-name{font-size:9px;text-transform:uppercase;flex:1;letter-spacing:.06em}
.pb-val{font-size:9px;color:var(--am3);min-width:30px;text-align:right}
.pb-add{font-size:8px;background:none;border:1px solid var(--b2);color:var(--tx3);padding:1px 5px;border-radius:2px;cursor:pointer;font-family:var(--mono)}
.pb-add:hover{border-color:var(--tl2);color:var(--tl3)}

.phrase-card{background:var(--bg3);border:1px solid var(--b1);border-radius:3px;padding:7px;margin-bottom:6px;position:relative}
.phrase-card.active{border-color:var(--co3)}
.phrase-hd{display:flex;align-items:center;gap:5px;margin-bottom:5px}
.phrase-hd .ph-name{font-size:9px;color:var(--co3);flex:1}
.phrase-hd .ph-rm{background:none;border:none;color:var(--tx3);cursor:pointer;font-size:10px}
.phrase-hd .ph-rm:hover{color:var(--co3)}

select,input[type=range]{width:100%;background:var(--bg4);border:1px solid var(--b2);color:var(--tx);font-family:var(--mono);font-size:9px;padding:2px 5px;border-radius:2px;appearance:none;outline:none}
select{margin-bottom:5px;height:22px}
select:focus{border-color:var(--am2)}
option{background:var(--bg4)}

.pr{display:flex;align-items:center;gap:5px;margin-bottom:4px}
.pr label{width:75px;font-size:8px;color:var(--tx3);flex-shrink:0;letter-spacing:.05em}
.pr input{flex:1}
.pr .pv{width:34px;text-align:right;font-size:8px;color:var(--am3)}

.btn{background:transparent;border:1px solid var(--b2);color:var(--tx);font-family:var(--mono);font-size:9px;padding:4px 9px;border-radius:2px;cursor:pointer;letter-spacing:.05em;transition:all .12s}
.btn:hover{border-color:var(--am2);color:var(--am3);background:rgba(184,122,8,.08)}
.btn.pri{border-color:var(--am2);color:var(--am3)}
.btn.pri:hover{background:rgba(184,122,8,.18)}
.btn.act{background:rgba(32,192,160,.12);border-color:var(--tl3);color:var(--tl3)}
.btn.sml{font-size:8px;padding:2px 6px}

canvas{display:block}
#cv{position:absolute;top:0;left:0}

.vtab{position:absolute;top:7px;right:7px;display:flex;gap:3px;z-index:5}
.vt{font-size:8px;letter-spacing:.1em;text-transform:uppercase;background:rgba(8,9,11,.85);border:1px solid var(--b2);color:var(--tx3);padding:2px 7px;border-radius:2px;cursor:pointer}
.vt.on{border-color:var(--am2);color:var(--am3)}
.ov{position:absolute;bottom:6px;left:8px;font-size:8px;color:var(--tx3);pointer-events:none}

.tabs{display:flex;gap:0;margin-bottom:8px;border-bottom:1px solid var(--b1)}
.tab{flex:1;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);padding:5px 4px;cursor:pointer;border-bottom:2px solid transparent;text-align:center}
.tab.on{color:var(--am3);border-bottom-color:var(--am3)}

.play-ind{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--tx3);margin-right:4px}
.play-ind.on{background:var(--gn3)}

.drop-zone{border:1px dashed var(--b2);border-radius:3px;padding:8px;text-align:center;font-size:8px;color:var(--tx3);cursor:pointer;margin-bottom:6px}
.drop-zone:hover,.drop-zone.over{border-color:var(--am2);color:var(--am3)}

.scope-toggle{display:flex;gap:3px;margin-bottom:6px;font-size:8px}
.scope-toggle button{flex:1;background:var(--bg4);border:1px solid var(--b2);color:var(--tx3);padding:3px 5px;border-radius:2px;cursor:pointer;font-family:var(--mono);font-size:8px;letter-spacing:.05em}
.scope-toggle button.on{background:rgba(184,122,8,.15);border-color:var(--am3);color:var(--am3)}

::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--b2)}

.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center}
.modal-box{background:var(--bg3);border:1px solid var(--b2);border-radius:4px;padding:14px;width:280px;max-height:500px;overflow-y:auto}
.modal-title{font-size:10px;color:var(--am3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
.modal-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.modal-row label{width:70px;font-size:9px;color:var(--tx3)}
.modal-row select,.modal-row input{flex:1}
.modal-btns{display:flex;gap:6px;margin-top:10px}
</style>
</head>
<body>
<div class="archive-banner">Archived version: <strong>Alchemist v3.1</strong> — <a href="../index.html">Open current version</a></div>
<div id="app">
<div id="hdr">
  <span class="title">ALCHEMIST</span>
  <span class="ver">v3.1 · scene timeline · phrase densities</span>
  <div class="hbtns">
    <span class="play-ind" id="pi"></span>
    <div class="scope-toggle" style="margin:0">
      <button id="scope-scene" class="on">SCENE</button>
      <button id="scope-piece">FULL PIECE</button>
    </div>
    <button class="btn pri" id="btnPlay">▶ PLAY</button>
    <button class="btn" id="btnStop">■ STOP</button>
    <button class="btn" id="btnGen">⟳ GEN</button>
    <button class="btn" id="btnMidi">↓ MIDI</button>
  </div>
</div>
<div id="scene-strip"><div style="font-size:8px;color:var(--am2);letter-spacing:.1em;text-transform:uppercase;margin-right:4px">SCENES →</div><div id="scene-list" style="display:flex;gap:4px;align-items:center"></div><button class="btn sml" id="btnAddScene">+ scene</button><button class="btn sml" id="btnDupScene">⧉ dup</button></div>
<div id="left"></div><div id="center"><canvas id="cv"></canvas><div class="ov" id="ov">Archived shell preserved for v3.1</div></div><div id="right"></div>
<div id="bot"><div class="bp"><div class="bp-title">Archive</div><div style="font-size:9px;color:var(--tx2)">This is the archived v3.1 interface snapshot.</div></div><div class="bp"><div class="bp-title">Status</div><div style="font-size:9px;color:var(--tx2)">Current version lives at <code>../index.html</code>.</div></div><div class="bp"></div><div class="bp"></div></div>
</div>
</body>
</html>
